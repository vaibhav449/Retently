name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer one waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  images:
    name: Image (${{ matrix.image }})
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: realtime
            dockerfile: apps/realtime/Dockerfile
          - image: worker
            dockerfile: apps/worker/Dockerfile
          - image: migrate
            dockerfile: packages/db/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Image prefix (registry paths must be lowercase)
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-${{ matrix.image }}:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to VM
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER }}
      APP_DIR: ${{ vars.APP_DIR }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deploy files to the VM
        run: scp deploy/compose.prod.yml deploy/Caddyfile deploy/deploy.sh "$VM_USER@$VM_HOST:$APP_DIR/"

      # In the next two steps the variables expand on the runner on purpose; the VM receives the values.
      - name: Log the VM in to GHCR with this job's short-lived token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh "$VM_USER@$VM_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Pull, migrate and restart
        run: |
          # shellcheck disable=SC2029
          ssh "$VM_USER@$VM_HOST" "cd '$APP_DIR' && chmod +x deploy.sh && IMAGE_TAG='$IMAGE_TAG' ./deploy.sh"

      - name: Log the VM out of GHCR
        if: always()
        run: ssh "$VM_USER@$VM_HOST" "docker logout ghcr.io" || true
