packages:
  - apps/*
  - packages/*

# pnpm 10 never runs dependency install scripts unless allowed. These two work without them.
ignoredBuiltDependencies:
  - esbuild
  - unrs-resolver

# One version per dependency for the whole repo. Packages reference these as "catalog:".
