  "@types/ws": 8.18.2
  amqplib: 2.2.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 9.39.5
  eslint-config-next: 16.4.2
  globals: 17.13.0
  next: 16.4.2
  postgres: 3.4.9
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  tsup: 8.5.1
  tsx: 4.23.15
  typescript: 6.0.3
  typescript-eslint: 8.71.2
  vite: 8.3.4
  vitest: 5.0.5
  ws: 8.22.0
  zod: 4.6.7
